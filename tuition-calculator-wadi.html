<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة الرسوم الدراسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1a2140;
    --navy-2: #232c52;
    --teal: #0EA5A5;
    --teal-dark: #0b8484;
    --gold: #c9a227;
    --bg: #ffffff;
    --card: #ffffff;
    --ink: #1c2733;
    --muted: #6c7b8a;
    --line: #e6e8ec;
    --good: #2e7d5b;
    --bad: #b5533c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app-shell{
    display:flex;
    min-height:100vh;
  }
  .side-decorative{
    width:340px;
    flex:none;
    position:sticky;
    top:0;
    height:100vh;
    overflow:hidden;
  }
  .side-decorative img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
  }
  .side-decorative-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(165deg, rgba(14,165,165,0.55) 0%, rgba(11,132,132,0.35) 45%, rgba(201,162,39,0.4) 100%);
    mix-blend-mode:multiply;
  }
  .main-content-wrapper{
    flex:1;
    min-width:0;
  }
  @media (max-width:900px){
    .side-decorative{ display:none; }
  }
  .wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px;}

  header.top{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    color:#fff;
    border-radius:16px;
    padding:22px 28px;
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }
  header.top::after{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 90% -10%, rgba(198,154,78,0.35), transparent 55%);
    pointer-events:none;
  }
  .header-inner{
    display:flex;
    align-items:center;
    gap:18px;
    position:relative;
  }
  .header-logo{
    width:64px; height:64px;
    flex:none;
    background:#fff;
    border-radius:14px;
    padding:6px;
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
  }
  .header-logo img{
    width:100%; height:100%;
    object-fit:contain;
  }
  header.top .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.5px;
    color:#d8c493;
    margin-bottom:6px;
  }
  header.top h1{
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size:24px;
    margin:0 0 4px;
  }
  header.top p{
    margin:0;
    color:#c4cfdd;
    font-size:14px;
  }

  .calc-bar{
    background:var(--teal);
    color:#fff;
    border-radius:14px;
    padding:14px 20px;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    user-select:none;
    box-shadow:0 2px 14px rgba(14,165,165,0.25);
  }
  .calc-bar:hover{ background:var(--teal-dark); }
  .calc-bar-left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .calc-bar-chevron{
    font-size:13px;
    transition:transform .2s;
  }
  .calc-bar-chevron.collapsed{ transform:rotate(180deg); }
  .calc-bar-print{
    background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.4);
    color:#fff;
    font-family:'Tajawal', sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding:7px 14px;
    border-radius:9px;
    cursor:pointer;
  }
  .calc-bar-print:hover{ background:rgba(255,255,255,0.3); }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px 22px;
    margin-bottom:18px;
    box-shadow:0 2px 14px rgba(26,33,64,0.05);
  }
  .card h2{
    font-family:'Cairo', sans-serif;
    font-size:16px;
    font-weight:700;
    margin:0 0 16px;
    color:var(--navy);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2 .dot{
    width:8px;height:8px;border-radius:50%;background:var(--gold);
    display:inline-block;
  }

  .grid{display:grid; gap:14px;}
  .grid.g2{grid-template-columns:1fr 1fr;}
  .grid.g3{grid-template-columns:1fr 1fr 1fr;}
  .grid.g4{grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));}
  @media (max-width:640px){ .grid.g2, .grid.g3, .grid.g4{grid-template-columns:1fr;} }

  label{
    font-size:12.5px;
    color:var(--muted);
    display:block;
    margin-bottom:5px;
    font-weight:500;
  }
  select, input[type=text], input[type=number]{
    width:100%;
    padding:10px 12px;
    border-radius:9px;
    border:1px solid var(--line);
    background:#fbfaf7;
    font-family:'Tajawal', sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  select:focus, input:focus{
    outline:none;
    border-color:var(--teal);
    background:#fff;
  }

  .field{margin-bottom:0;}

  .checks{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
  .checkrow{
    display:flex; align-items:center; gap:9px;
    background:#fbfaf7; border:1px solid var(--line); border-radius:9px;
    padding:9px 12px; font-size:13.5px;
  }
  .checkrow input{width:16px;height:16px;accent-color:var(--teal);}

  .student-row{
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:10px;
    background:#fdfcfa;
    overflow:hidden;
  }
  .student-row.expanded{
    border-color:var(--teal);
  }
  .row-main{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:11px 14px;
    cursor:pointer;
    flex-wrap:wrap;
  }
  .row-left{
    display:flex; align-items:center; gap:10px;
    min-width:0;
  }
  .row-left .badge{
    font-family:'IBM Plex Mono', monospace;
    background:var(--navy);
    color:#fff;
    font-size:12px;
    width:26px; height:26px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .row-info{min-width:0;}
  .row-stage{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:13.5px;
    color:var(--navy);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:160px;
  }
  .row-sub{font-size:11px; color:var(--muted); margin-top:1px;}

  .row-mid{
    display:flex; align-items:center; gap:6px;
    flex-wrap:wrap;
  }
  .mini-select{
    padding:6px 8px;
    border-radius:7px;
    border:1px solid var(--line);
    background:#fff;
    font-size:12px;
    font-family:'Tajawal', sans-serif;
    color:var(--ink);
  }
  .mini-tag{
    background:#eef5f4;
    color:var(--teal);
    border:1px solid #d9e6e3;
    border-radius:7px;
    padding:6px 10px;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
  }

  .row-right{
    display:flex; align-items:center; gap:8px;
  }
  .row-total{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:14px;
    color:var(--navy);
    white-space:nowrap;
  }
  .chevron{
    color:var(--muted);
    font-size:11px;
  }

  .student-details{
    padding:0 14px 14px;
    border-top:1px dashed var(--line);
    margin-top:2px;
    padding-top:12px;
  }

  .remove-btn-full{
    display:block;
    width:calc(100% - 28px);
    margin:0 14px 14px;
    background:none;
    border:1px solid var(--bad);
    color:var(--bad);
    font-size:12.5px; cursor:pointer; font-family:'Tajawal',sans-serif;
    padding:8px;
    border-radius:8px;
  }
  .remove-btn-full:hover{background:#fbeeea;}

  .add-btn{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1.5px dashed var(--teal);
    background:#eef5f4;
    color:var(--teal);
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .add-btn:hover{background:#e3efee;}

  .receipt{
    margin-top:12px;
    border-top:1.5px dashed var(--line);
    padding-top:12px;
  }

  .installments{
    margin-top:12px;
    background:#f2f6f5;
    border:1px solid #d9e6e3;
    border-radius:10px;
    padding:12px 14px;
  }
  .installments-title{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:12.5px;
    color:var(--teal);
    margin-bottom:9px;
  }
  .installments-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:8px;
  }
  .inst-item{
    background:#fff;
    border:1px solid #d9e6e3;
    border-radius:8px;
    padding:8px 10px;
    text-align:center;
  }
  .inst-label{
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:4px;
  }
  .inst-amount{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:14px;
    color:var(--navy);
  }
  .rline{
    display:flex; justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:5px 0;
    color:var(--ink);
  }
  .rline.sub{color:var(--muted); font-size:12.5px;}
  .rline.discount span:last-child{color:var(--good);}
  .rline.tax span:last-child{color:var(--bad);}
  .rline.total{
    border-top:1px solid var(--line);
    margin-top:6px; padding-top:10px;
    font-weight:700; font-size:15px; color:var(--navy);
  }

  .summary{
    background:linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
    color:#fff;
    border-radius:16px;
    padding:24px 26px;
    position:sticky; bottom:16px;
    box-shadow:0 12px 30px rgba(14,165,165,0.35);
  }
  .summary .row{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    padding:4px 0;
    color:#c4cfdd;
  }
  .summary .grand{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:10px; padding-top:12px;
    border-top:1px solid rgba(255,255,255,0.18);
  }
  .summary .grand .label{
    font-family:'Cairo', sans-serif; font-weight:700; font-size:15px;
  }
  .summary .grand .value{
    font-family:'Cairo', sans-serif; font-weight:800; font-size:26px;
    color:var(--gold);
  }

  .summary-installments{
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed rgba(255,255,255,0.18);
  }
  .summary-inst-row{
    color:#e7dcc2 !important;
  }
  .summary-inst-row span:last-child{
    font-weight:700;
    color:var(--gold);
  }

  .empty{
    text-align:center; padding:30px 10px; color:var(--muted); font-size:14px;
  }

  .stage-picker{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
    gap:10px;
  }
  .stage-row{
    display:flex; align-items:center; justify-content:space-between;
    background:#fbfaf7; border:1px solid var(--line); border-radius:9px;
    padding:9px 10px 9px 8px;
  }
  .stage-row.active{
    border-color:var(--teal);
    background:#eef5f4;
  }
  .stage-row .stage-name{
    font-size:13.5px; font-weight:500; color:var(--ink);
  }
  .stage-row .stepper{
    display:flex; align-items:center; gap:8px;
  }
  .stage-row .stepper button{
    width:24px; height:24px; border-radius:6px;
    border:1px solid var(--line); background:#fff;
    font-family:'IBM Plex Mono', monospace; font-size:15px; line-height:1;
    color:var(--navy); cursor:pointer;
  }
  .stage-row .stepper button:hover{ background:#eef5f4; border-color:var(--teal); }
  .stage-row .stepper .count{
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:14px;
    min-width:14px; text-align:center;
  }

  .stage-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    background:#eef5f4;
    color:var(--teal);
    border:1px solid #d9e6e3;
    border-radius:20px;
    padding:3px 10px;
  }
  .field .stage-tag{
    display:block;
    width:100%;
    box-sizing:border-box;
    padding:10px 12px;
    border-radius:9px;
    font-size:13.5px;
    text-align:center;
    font-weight:600;
  }

  .footnote{
    text-align:center; color:var(--muted); font-size:12px; margin-top:18px;
  }

  .school-option{
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:14px;
    transition:border-color .15s, background .15s;
  }
  .school-option:hover{
    border-color:var(--teal);
    background:#f9fdfc;
  }
  .school-option-name{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--navy);
  }
  .school-option-sub{
    font-size:13px;
    color:var(--muted);
    margin-top:3px;
  }
  .school-option-arrow{
    font-size:22px;
    color:var(--gold);
    flex:none;
  }

  .print-only{ display:none; }

  @media print{
    body{ background:#fff; padding-bottom:0; font-size:12px; }
    .wrap{ max-width:100%; padding:0; }

    #calcBar, #settingsCard,
    .add-btn, .remove-btn-full, .chevron,
    .stage-row .stepper button,
    .row-mid select, .mini-select,
    .checks input[type=checkbox],
    #stagePickerCard,
    #academicYearField,
    .footnote{
      display:none !important;
    }

    .print-only{ display:block; margin-bottom:14px; }
    .print-meta-row{
      display:flex; justify-content:space-between;
      font-size:12px; padding:4px 0; border-bottom:1px solid #ddd;
    }

    .card{ border:1px solid #ccc; break-inside:avoid; box-shadow:none; }

    .student-row{ break-inside:avoid; border:1px solid #ccc; margin-bottom:8px; }
    .row-main{ cursor:default; }
    .student-details{ display:block !important; }

    .mini-tag{ background:#eee !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }

    .summary{
      position:static !important;
      box-shadow:none !important;
      background:var(--teal) !important;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
      break-inside:avoid;
      margin-top:14px;
    }

    .checkrow{ background:#f5f5f5 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>

<script>
const SCHOOLS = {
  wadi: {
    id: 'wadi',
    name: 'مدرسة الرؤية الجديدة - الوادي',
    subtitle: 'شمال الرياض',
    trackLocked: false,
    siblingConfig: { amt2_3:1000, amt4:2000, pct5:50, freeFrom6:false, pct6:60, pct7plus:70 },
    stages: [
      {name:"KG 1", intl:22000, natl:20000},
      {name:"KG 2", intl:22000, natl:20000},
      {name:"KG 3", intl:22000, natl:20000},
      {name:"Grade 1 ESL", intl:26000, natl:21000},
      {name:"Grade 1 R", intl:24000, natl:21000},
      {name:"Grade 2", intl:24000, natl:21000},
      {name:"Grade 3", intl:24000, natl:21000},
      {name:"Grade 4", intl:27000, natl:22000},
      {name:"Grade 5", intl:27000, natl:22000},
      {name:"Grade 6", intl:27000, natl:22000},
      {name:"Grade 7", intl:29000, natl:23000},
      {name:"Grade 8", intl:29000, natl:23000},
      {name:"Grade 9", intl:29000, natl:23000},
      {name:"Grade 10", intl:32000, natl:25000},
      {name:"Grade 11", intl:32000, natl:25000},
      {name:"Grade 12", intl:32000, natl:25000},
    ]
  }
};

let currentSchool = null;
let STAGES = [];
function isKGStage(stageName){
  return typeof stageName === 'string' && stageName.indexOf('KG') === 0;
}

let students = [];
let nextId = 1;
let trackMode = 'mix'; // 'intl' | 'natl' | 'mix'
let nationality = 'saudi'; // 'saudi' | 'resident' — applies to all students
let paymentMode = 'unified'; // 'unified' | 'perStudent'
let globalMethod = 'full';
let academicYear = '2026-2027'; // حقل معلوماتي مرجعي، لا يؤثر على الحساب حاليًا

function setAcademicYear(value){
  academicYear = value;
}

// ---------- الطباعة / تصدير PDF ----------
function printReport(){
  if(!currentSchool || students.length === 0){
    alert('أضف طالبًا واحدًا على الأقل قبل الطباعة');
    return;
  }

  // فتح كل بطاقات الطلاب مؤقتًا عشان تظهر التفاصيل كاملة في المطبوع
  const previousExpanded = students.map(s => s.expanded);
  students.forEach(s => s.expanded = true);

  const trackLabels = {mix:'مزيج (حسب كل طالب)', intl:'عالمي', natl:'أهلي'};
  const nationalityLabel = nationality === 'resident' ? 'مقيم (+15% ضريبة قيمة مضافة)' : 'سعودي (بدون ضريبة)';
  const paymentModeLabel = paymentMode === 'unified'
    ? ('نفس الطريقة للجميع — ' + ({full:'سداد كامل', regular:'سداد منتظم', flexible:'سداد مرن', tamara:'تمارا'}[globalMethod]))
    : 'طريقة مختلفة لكل طالب';
  const todayStr = new Date().toLocaleDateString('ar-SA-u-nu-latn', {year:'numeric', month:'2-digit', day:'2-digit'});

  document.getElementById('printMeta').innerHTML = `
    <div class="print-meta-row"><span>الفرع</span><span>${currentSchool.name} — ${currentSchool.subtitle}</span></div>
    <div class="print-meta-row"><span>سنة التسجيل</span><span>${academicYear}</span></div>
    <div class="print-meta-row"><span>تاريخ الإصدار</span><span>${todayStr}</span></div>
    ${!currentSchool.trackLocked ? `<div class="print-meta-row"><span>المسار</span><span>${trackLabels[trackMode]}</span></div>` : ''}
    <div class="print-meta-row"><span>الجنسية</span><span>${nationalityLabel}</span></div>
    <div class="print-meta-row"><span>طريقة السداد</span><span>${paymentModeLabel}</span></div>
  `;

  render();

  const restore = () => {
    students.forEach((s, i) => { if(previousExpanded[i] !== undefined) s.expanded = previousExpanded[i]; });
    document.getElementById('printMeta').innerHTML = '';
    render();
    window.removeEventListener('afterprint', restore);
  };
  window.addEventListener('afterprint', restore);

  setTimeout(() => window.print(), 50);
}

function toggleCalcBar(){
  const body = document.getElementById('calcBody');
  const chevron = document.getElementById('calcBarChevron');
  const collapsed = body.style.display === 'none';
  body.style.display = collapsed ? '' : 'none';
  chevron.classList.toggle('collapsed', !collapsed);
}

function setTrackMode(mode){
  trackMode = mode;
  if(mode !== 'mix'){
    students.forEach(s => s.track = mode);
  }
  render();
}

function setNationality(value){
  nationality = value;
  render();
}

function setPaymentMode(mode){
  paymentMode = mode;
  render();
}

function setGlobalMethod(value){
  globalMethod = value;
  render();
}

function getMethod(s){
  return paymentMode === 'unified' ? globalMethod : s.method;
}

function initSchool(id){
  currentSchool = SCHOOLS[id];
  STAGES = currentSchool.stages;

  students = [];
  nextId = 1;
  trackMode = currentSchool.trackLocked ? 'intl' : 'mix';
  nationality = 'saudi';
  paymentMode = 'unified';
  globalMethod = 'full';

  const trackCard = document.getElementById('trackCard');
  if(trackCard) trackCard.style.display = currentSchool.trackLocked ? 'none' : '';

  render();
}

function fmt(n){
  return (Math.round(n*100)/100).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function addStudent(stageName){
  students.push({
    id: nextId++,
    track: trackMode === 'natl' ? 'natl' : 'intl',
    stage: stageName,
    method: "full",
    sem2OnTime: false,
    installment2OnTime: false,
    fullPaidOnTime: false,
    expanded: false
  });
  render();
}

function toggleExpand(id){
  const s = students.find(s => s.id === id);
  if(!s) return;
  s.expanded = !s.expanded;
  render();
}

function stageLevel(stageName){
  return STAGES.findIndex(st => st.name === stageName); // higher index = older
}

function stageCount(stageName){
  return students.filter(s => s.stage === stageName).length;
}

function incStage(stageName){
  addStudent(stageName);
}

function decStage(stageName){
  for(let i = students.length - 1; i >= 0; i--){
    if(students[i].stage === stageName){
      students.splice(i, 1);
      break;
    }
  }
  render();
}

function removeStudent(id){
  students = students.filter(s => s.id !== id);
  render();
}

function updateStudent(id, key, value){
  const s = students.find(s => s.id === id);
  if(!s) return;
  s[key] = value;
  render();
}

function getBaseFee(s){
  const stage = STAGES.find(st => st.name === s.stage);
  if(!stage) return 0;
  return s.track === 'intl' ? stage.intl : stage.natl;
}

function siblingDiscount(order, baseFee){
  const o = Number(order);
  if(o <= 1) return 0;
  const cfg = (currentSchool && currentSchool.siblingConfig) || { amt2_3:1000, amt4:2000, pct5:50, freeFrom6:false, pct6:60, pct7plus:70 };
  if(o === 2 || o === 3) return cfg.amt2_3;
  if(o === 4) return cfg.amt4;
  if(o === 5) return baseFee * (cfg.pct5/100);
  if(cfg.freeFrom6) return baseFee; // الابن السادس فأكثر: مجانًا بالكامل
  if(o === 6) return baseFee * (cfg.pct6/100);
  return baseFee * (cfg.pct7plus/100); // 7+
}

function paymentDiscount(s){
  const isKG = isKGStage(s.stage);
  const method = getMethod(s);
  if(method === 'full') return 3000;
  if(method === 'regular'){
    let d = 1000; // الفصل الأول: خصم تلقائي دائمًا
    if(s.sem2OnTime) d += 1000;
    return d;
  }
  if(method === 'flexible'){
    let d = 0;
    const step = isKG ? 500 : 750;
    if(s.installment2OnTime) d += step;
    if(s.fullPaidOnTime) d += step;
    return d;
  }
  if(method === 'tamara') return 1000;
  return 0;
}

function computeStudent(s, order){
  const resident = nationality === 'resident';
  const base = getBaseFee(s);
  const sib = siblingDiscount(order, base);
  const afterSib = base - sib;
  const pay = paymentDiscount(s);
  const afterPay = afterSib - pay;
  const afterExtra = afterPay; // لا يوجد خصم إضافي في هذه النسخة
  const vat = resident ? afterExtra * 0.15 : 0;
  const total = afterExtra + vat;
  return {base, sib, afterSib, pay, afterExtra, vat, total, resident};
}

function getStudentInstallments(s, c, method){
  const resident = c.resident;
  const netMult = 1 + (resident ? 0.15 : 0);

  let installments = [];
  if(method === 'full'){
    installments = [{label:'دفعة واحدة (100%)', amount:c.total}];
  } else if(method === 'regular'){
    const sem1Net = (c.afterSib/2) - 1000; // الفصل الأول: خصم تلقائي دائمًا
    const sem2Net = (c.afterSib/2) - (s.sem2OnTime ? 1000 : 0);
    installments = [
      {label:'دفعة الفصل الأول (50%)', amount: sem1Net * netMult},
      {label:'دفعة الفصل الثاني (50%)', amount: sem2Net * netMult},
    ];
  } else if(method === 'flexible'){
    const isKG = isKGStage(s.stage);
    const step = isKG ? 500 : 750;
    const p1Net = c.afterSib*0.35;
    const p2Net = (c.afterSib*0.35) - (s.installment2OnTime ? step : 0);
    const p3Net = (c.afterSib*0.30) - (s.fullPaidOnTime ? step : 0);
    installments = [
      {label:'الدفعة الأولى (35%)', amount: p1Net * netMult},
      {label:'الدفعة الثانية (35%)', amount: p2Net * netMult},
      {label:'الدفعة الثالثة (30%)', amount: p3Net * netMult},
    ];
  } else if(method === 'tamara'){
    installments = [{label:'دفعة واحدة عبر تمارا (100%)', amount:c.total}];
  }
  return installments;
}

function studentCard(s, idx){
  const c = computeStudent(s, idx + 1);
  const resident = c.resident;
  const method = getMethod(s);

  const orderLabels = ['الأول (الأكبر)','الثاني','الثالث','الرابع','الخامس','السادس'];
  const orderLabel = idx < orderLabels.length ? orderLabels[idx] : `السابع${idx>6?' فأكثر':''}`;

  const methodLabels = {full:'سداد كامل', regular:'سداد منتظم', flexible:'سداد مرن', tamara:'تمارا'};

  // --- Compact row (always visible) ---
  const trackFieldCompact = trackMode === 'mix' ? `
      <select class="mini-select" onchange="updateStudent(${s.id},'track',this.value)">
        <option value="intl" ${s.track==='intl'?'selected':''}>عالمي</option>
        <option value="natl" ${s.track==='natl'?'selected':''}>أهلي</option>
      </select>` : '';

  const methodFieldCompact = paymentMode === 'perStudent' ? `
      <select class="mini-select" onchange="updateStudent(${s.id},'method',this.value)">
        <option value="full" ${s.method==='full'?'selected':''}>سداد كامل</option>
        <option value="regular" ${s.method==='regular'?'selected':''}>سداد منتظم</option>
        <option value="flexible" ${s.method==='flexible'?'selected':''}>سداد مرن</option>
        <option value="tamara" ${s.method==='tamara'?'selected':''}>تمارا</option>
      </select>` : `<span class="mini-tag">${methodLabels[method]}</span>`;

  // --- Expanded details (only built if expanded, to keep DOM light) ---
  let detailsHtml = '';
  if(s.expanded){
    let methodExtra = '';
    if(method === 'regular'){
      methodExtra = `
        <div class="checks">
          <label class="checkrow"><input type="checkbox" ${s.sem2OnTime?'checked':''} onchange="updateStudent(${s.id},'sem2OnTime',this.checked)"> سداد الدفعة الثانية قبل نهاية الأسبوع الأول من الفصل الثاني (خصم 1000)</label>
        </div>`;
    } else if(method === 'flexible'){
      const isKG = isKGStage(s.stage);
      const step = isKG ? 500 : 750;
      methodExtra = `
        <div class="checks">
          <label class="checkrow"><input type="checkbox" ${s.installment2OnTime?'checked':''} onchange="updateStudent(${s.id},'installment2OnTime',this.checked)"> سداد الدفعة الثانية (70%) قبل 30-11-2026 (خصم ${step})</label>
          <label class="checkrow"><input type="checkbox" ${s.fullPaidOnTime?'checked':''} onchange="updateStudent(${s.id},'fullPaidOnTime',this.checked)"> اكتمال السداد بالكامل قبل 30-3-2027 (خصم ${step})</label>
        </div>`;
    }

    const installments = getStudentInstallments(s, c, method);

    const installmentsHtml = installments.length ? `
      <div class="installments">
        <div class="installments-title">جدول الدفعات</div>
        <div class="installments-grid">
          ${installments.map(i => `
            <div class="inst-item">
              <div class="inst-label">${i.label}</div>
              <div class="inst-amount">${fmt(i.amount)} ﷼</div>
            </div>
          `).join('')}
        </div>
      </div>` : '';

    detailsHtml = `
      <div class="student-details">
        ${methodExtra}
        ${installmentsHtml}
        <div class="receipt">
          <div class="rline sub"><span>الرسوم الأساسية</span><span>${fmt(c.base)}</span></div>
          <div class="rline discount"><span>خصم الإخوة</span><span>− ${fmt(c.sib)}</span></div>
          <div class="rline discount"><span>خصم طريقة السداد</span><span>− ${fmt(c.pay)}</span></div>
          <div class="rline sub"><span>الصافي قبل الضريبة</span><span>${fmt(c.afterExtra)}</span></div>
          <div class="rline tax"><span>ضريبة القيمة المضافة${resident? ' (15%)':''}</span><span>${resident? '+ '+fmt(c.vat) : '—'}</span></div>
        </div>
      </div>`;
  }

  return `
  <div class="student-row ${s.expanded?'expanded':''}">
    <div class="row-main" onclick="toggleExpand(${s.id})">
      <div class="row-left">
        <span class="badge">${idx+1}</span>
        <div class="row-info">
          <div class="row-stage">${s.stage}</div>
          <div class="row-sub">الابن ${orderLabel}</div>
        </div>
      </div>
      <div class="row-mid" onclick="event.stopPropagation()">
        ${trackFieldCompact}
        ${methodFieldCompact}
      </div>
      <div class="row-right">
        <span class="row-total">${fmt(c.total)} ﷼</span>
        <span class="chevron">${s.expanded ? '▲' : '▼'}</span>
      </div>
    </div>
    ${detailsHtml}
    ${s.expanded ? `<button class="remove-btn-full" onclick="removeStudent(${s.id})">حذف هذا الطالب ✕</button>` : ''}
  </div>`;
}


function renderStagePicker(){
  const picker = document.getElementById('stagePicker');
  picker.innerHTML = STAGES.map(st => {
    const count = stageCount(st.name);
    return `
      <div class="stage-row ${count>0?'active':''}">
        <span class="stage-name">${st.name}</span>
        <div class="stepper">
          <button onclick="decStage('${st.name}')" ${count===0?'disabled':''}>−</button>
          <span class="count">${count}</span>
          <button onclick="incStage('${st.name}')">+</button>
        </div>
      </div>`;
  }).join('');
}

function render(){
  renderStagePicker();

  const globalMethodField = document.getElementById('globalMethodField');
  globalMethodField.style.display = paymentMode === 'unified' ? '' : 'none';

  // ترتيب الطلاب تلقائيًا من الأكبر مرحلة (الأكبر سنًا) إلى الأصغر
  const sorted = students.slice().sort((a, b) => stageLevel(b.stage) - stageLevel(a.stage));

  const container = document.getElementById('studentsContainer');
  const studentsCard = document.getElementById('studentsCard');

  if(sorted.length === 0){
    studentsCard.style.display = 'none';
  } else {
    studentsCard.style.display = '';
    container.innerHTML = sorted.map((s, idx) => studentCard(s, idx)).join('');
  }

  let grandBase=0, grandSib=0, grandPay=0, grandVat=0, grandTotal=0;
  const installmentTotals = []; // [{label, amount}] مجمّعة حسب رقم الدفعة (الأولى/الثانية/الثالثة)

  sorted.forEach((s, idx) => {
    const c = computeStudent(s, idx + 1);
    grandBase += c.base;
    grandSib += c.sib;
    grandPay += c.pay;
    grandVat += c.vat;
    grandTotal += c.total;

    const method = getMethod(s);
    const studentInstallments = getStudentInstallments(s, c, method);
    studentInstallments.forEach((inst, i) => {
      if(!installmentTotals[i]) installmentTotals[i] = 0;
      installmentTotals[i] += inst.amount;
    });
  });

  const installmentLabels = ['الدفعة الأولى', 'الدفعة الثانية', 'الدفعة الثالثة'];

  const summary = document.getElementById('summaryBox');
  if(sorted.length === 0){
    summary.style.display = 'none';
    summary.innerHTML = '';
    return;
  }
  summary.style.display = '';
  summary.innerHTML = `
    ${installmentTotals.length > 1 ? `
    <div class="summary-installments" style="margin-top:0; border-top:none; padding-top:0;">
      ${installmentTotals.map((amt, i) => `
        <div class="row summary-inst-row"><span>${installmentLabels[i] || ('دفعة ' + (i+1))} (إجمالي كل الطلاب)</span><span>${fmt(amt)} ﷼</span></div>
      `).join('')}
    </div>` : ''}
    <div class="grand" style="${installmentTotals.length > 1 ? '' : 'margin-top:0; padding-top:0; border-top:none;'}">
      <span class="label">الإجمالي المستحق شامل الضريبة (${sorted.length} طالب)</span>
      <span class="value">${fmt(grandTotal)} ﷼</span>
    </div>
  `;
}

initSchool('wadi');
</script>
</body>
</html>
